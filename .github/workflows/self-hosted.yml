name: Self-Hosted

on:
  push:
    branches:
      - main
      - release
      - pre-release
    paths:
      - '.github/**'
      - 'deps/**'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'python/**'
      - '.gitignore'
      - '.gitmodules'
      - 'CMakeLists.txt'
  pull_request:
    branches: [ main ]

env:
  build-dir: "build"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
    env:
      config: "Release"
      nt: "4"

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - name: Configure CMake
        run: |
          cmake . -G Ninja                             \
                  -B ${{ env.build-dir }}              \
                  -DCMAKE_BUILD_TYPE=${{ env.config }} \
                  -DSPLA_BUILD_TESTS=ON

      - name: Build library sources
        run: |
          cmake --build ${{ env.build-dir }} \
                --target all \
                --verbose \
                -j ${{ env.nt }}

  test:
    name: Test ${{ matrix.config }}
    needs: build
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        config:
          - ci_cpu
          - ci_opencl_cpu
          - ci_amd_gfx1031
          - ci_nvidia_gt1030
          - ci_amd_rusticl

    env:
      config-file: .github/workflows/ci_spla_conf.json
      test-file: ${{ matrix.config }}_tests.log

    steps:
      - name: Verify environment
        run: |
          ./${{ env.build-dir }}/spla --softcheck \
                                     --spla-config-file=${{ env.config-file }} \
                                     --spla-config=${{ matrix.config }}

      - name: Run tests
        run: |
          python3 ./run_tests.py --build-dir=${{ env.build-dir }} \
                                 --config-file=${{ env.config-file }} \
                                 --config=${{ matrix.config }} \
                                 | tee ${{ env.test-file }}

      - name: Upload tests resutls
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.test-file }}
          path: ${{ env.test-file }}

      - name: Check for tests results
        run: |
          ! grep -qi "FAILED" ${{ env.test-file }}

  clean:
    name: Cleanup workspace
    needs: test
    if: always()
    runs-on: self-hosted

    steps:
      - name: Cleanup workspace
        run: |
          rm -rf ${{ github.workspace }}/*
          rm -rf ${{ github.workspace }}/.*
